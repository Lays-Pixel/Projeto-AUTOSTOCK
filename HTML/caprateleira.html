<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Prateleiras</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/capratileira.css">
</head>
<body>

    <div class="container" id="novaprateleira"> 
        <h2>Cadastro de prateleiras</h2>

        <form id="novoproduto">
        <div class="form-group">
            <label for="capacidade" id="capacidade">Capacidade das prateleiras:</label>
            <input type="text" id="capacidade">
           
        </div>

        <div class="form-group">
            <label for="identificação">Identificação da nova prateleira:</label>
            <input type="text" id="identificação">
        </div>

        <div class="form-group">
            <label for="stts"> Status da nova prateleira:</label>
            <select id="stts">
            <option value="">Selecione</option>
            <option value="Livre">Disponivel</option>
            <option value="Ocupada">Ocupada</option>
            <option value="Manutenção">Manutenção</option> 
            </select>
        </div>

        <button onclick="cadastrar()">CADASTRAR</button>
        </form>
    </div>

    <script src="../js/caprateleira.js"></script>
</body> 
</html>
